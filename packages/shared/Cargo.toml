[package]
name = "earth-guardians-shared"
version = "1.0.0"
edition = "2021"
authors = ["Earth Guardians Team <dev@earthguardians.org>"]
description = "Earth Guardians shared WASM utilities for compression, hashing, and P2P operations"
license = "MIT"
readme = "README.md"
repository = "https://github.com/earth-guardians/platform"
homepage = "https://earthguardians.org"
keywords = ["wasm", "webassembly", "compression", "hashing", "p2p"]
categories = ["wasm", "compression", "cryptography"]

[lib]
name = "earth_guardians_shared"
crate-type = ["cdylib", "rlib"]

[features]
default = ["console"]
console = ["web-sys/console"]
wasm = ["dep:wasm-bindgen"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.92"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]

[dependencies]
js-sys = { version = "0.3.69", optional = true }
web-sys = { version = "0.3.69", features = [
  "console",
  "Window",
  "Document",
  "Element",
  "HtmlElement",
  "Node",
  "console"
] }
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = { version = "0.6", optional = true }
base64 = "0.21"
getrandom = { version = "0.2", features = ["js"] }
serde_json = "1.0"

[dev-dependencies]
wasm-bindgen-test = "0.3.42"
wasm-pack = "0.12"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O3", "--dce"]

[package.metadata.wasm-pack.profile.dev]
wasm-opt = false
