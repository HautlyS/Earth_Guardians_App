name: Build Mobile

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - android
          - ios

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '9.0.0'
  ANDROID_SDK_VERSION: '1100'  # Android SDK 33

concurrency:
  group: build-mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm
        run: |
          corepack enable
          corepack prepare pnpm@${{ env.PNPM_VERSION }} --activate
          pnpm --version'

      - name: Get pnpm store directory
        id: pnpm-cache
        run: |
          echo "STORE_DIR=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_DIR }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Web
        run: pnpm build:web

      - name: Initialize Capacitor
        run: |
          cd apps/web
          npx @capacitor/cli init "Earth Guardians" "org.earthguardians.app" --web-dir=dist || true

      - name: Add Android platform
        run: |
          cd apps/web
          npx cap add android || true

      - name: Sync Capacitor
        run: |
          cd apps/web
          npx cap sync android || true

      - name: Build Android APK (Debug)
        run: |
          cd apps/web/android
          ./gradlew assembleDebug --stacktrace || true

      - name: Build Android APK (Release)
        if: github.event.inputs.platform != 'android' || github.event.inputs.platform == 'all'
        run: |
          cd apps/web/android
          ./gradlew assembleRelease --stacktrace || true

      - name: List APK files
        run: |
          echo "=== Generated APK files ==="
          find apps/web/android -name "*.apk" -type f 2>/dev/null | head -20

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: |
            apps/web/android/app/build/outputs/apk/debug/*.apk
            apps/web/android/app/build/outputs/apk/debug/*.aab
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: android-release-apk
          path: |
            apps/web/android/app/build/outputs/apk/release/*.apk
            apps/web/android/app/build/outputs/apk/release/*.aab
          retention-days: 7
          if-no-files-found: ignore

  build-ios:
    name: Build iOS
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm
        run: |
          corepack enable
          corepack prepare pnpm@${{ env.PNPM_VERSION }} --activate
          pnpm --version'

      - name: Get pnpm store directory
        id: pnpm-cache
        run: |
          echo "STORE_DIR=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_DIR }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Web
        run: pnpm build:web

      - name: Initialize Capacitor
        run: |
          cd apps/web
          npx @capacitor/cli init "Earth Guardians" "org.earthguardians.app" --web-dir=dist || true

      - name: Add iOS platform
        run: |
          cd apps/web
          npx cap add ios || true

      - name: Sync Capacitor
        run: |
          cd apps/web
          npx cap sync ios || true

      - name: List available simulators
        run: |
          xcrun simctl list devices available | head -30

      - name: Build iOS (Simulator)
        run: |
          cd apps/web/ios
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Debug -destination 'platform=iOS Simulator,name=iPhone 15' -archivePath build/App.xcarchive archive || true

      - name: Build iOS (Release)
        run: |
          cd apps/web/ios
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -destination 'generic/platform=iOS' -archivePath build/App.xcarchive archive CODE_SIGNING_ALLOWED=NO || true

      - name: List build artifacts
        run: |
          echo "=== iOS build artifacts ==="
          find apps/web/ios/build -name "*.xcarchive" -o -name "*.ipa" -type d 2>/dev/null | head -20

      - name: Upload iOS build
        uses: actions/upload-artifact@v4
        with:
          name: ios-build
          path: |
            apps/web/ios/build/*.xcarchive
            apps/web/ios/build/*.ipa
          retention-days: 7
          if-no-files-found: ignore

  build-report:
    name: Build Report
    needs: [build-android, build-ios]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Summary
        run: |
          echo "## Mobile Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Platform | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Android | ${{ needs.build-android.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| iOS | ${{ needs.build-ios.result }} |" >> $GITHUB_STEP_SUMMARY
