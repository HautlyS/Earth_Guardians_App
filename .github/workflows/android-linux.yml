name: Android & Linux Build

on:
  push:
    branches: [main, develop, 'release/**']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

env:
  JAVA_VERSION: '17'
  NODE_VERSION: '18'
  GRADLE_VERSION: '8.2'

jobs:
  android-build:
    name: Android Build (${{ inputs.build_type || 'debug' }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'gradle'
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: Cache Gradle
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      
      - name: Install Android SDK
        uses: android-actions/setup-android@v2
      
      - name: Setup environment variables
        run: |
          echo "ANDROID_HOME=${{ github.workspace }}/android-sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=${{ github.workspace }}/android-sdk" >> $GITHUB_ENV
          echo "JAVA_HOME=${{ runner.tool_cache }}/Java_temurin-17_hotspot_x64" >> $GITHUB_ENV
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build Android
        run: |
          npm run build:android || npm run build
        env:
          BUILD_TYPE: ${{ inputs.build_type || 'debug' }}
      
      - name: Verify APK output
        run: |
          if [ -d "platforms/android/app/build/outputs/apk" ]; then
            echo "APK files found:"
            find platforms/android/app/build/outputs/apk -name "*.apk" -exec ls -lh {} \;
          else
            echo "Warning: APK directory not found"
            ls -la platforms/android/ 2>/dev/null || echo "No android platform"
          fi
      
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-apk-${{ inputs.build_type || 'debug' }}
          path: platforms/android/app/build/outputs/apk/**/*.apk
          retention-days: 30

  linux-build:
    name: Linux Build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libgtk-3-dev \
            libnotify-dev \
            libnss3 \
            libxss-dev \
            libxtst-dev \
            xdg-utils \
            libatspi2.0-dev \
            libdrm-dev \
            libgbm-dev \
            libasound2 \
            wget \
            unzip
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build Linux AppImage
        run: |
          npm run build:linux || npm run build:electron:linux || npm run build
        env:
          ELECTRON_CACHE: ${{ runner.temp }}/electron_cache
      
      - name: Verify Linux build output
        run: |
          echo "Build output:"
          ls -la dist/ 2>/dev/null || echo "Checking other locations..."
          find . -name "*.AppImage" -o -name "*.deb" -o -name "*.rpm" 2>/dev/null | head -20
      
      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-build
          path: |
            dist/**/*.AppImage
            dist/**/*.deb
            dist/**/*.rpm
          retention-days: 30

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run tests
        run: npm test || npm run test:unit || echo "No test script configured"