name: Android & Linux Build

on:
  push:
    branches: [main, develop, 'release/**']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

env:
  JAVA_VERSION: '17'
  NODE_VERSION: '18'
  GRADLE_VERSION: '8.2'

jobs:
  android-build:
    name: Android Build (${{ inputs.build_type || 'debug' }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'gradle'
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: Cache Gradle
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      
      - name: Install Android SDK
        uses: android-actions/setup-android@v2
      
      - name: Setup environment variables
        run: |
          echo "ANDROID_HOME=${{ github.workspace }}/android-sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=${{ github.workspace }}/android-sdk" >> $GITHUB_ENV
          echo "JAVA_HOME=${{ runner.tool_cache }}/Java_temurin-17_hotspot_x64" >> $GITHUB_ENV
      
      - name: Install dependencies
        run: |
          if [ -f package.json ]; then
            npm ci || npm install
          else
            echo "No package.json found, skipping dependency installation"
          fi
      
      - name: Build Android
        run: |
          if [ -f "platforms/android/build.gradle" ] || [ -d "platforms/android" ]; then
            npm run build:android || npm run build
          else
            echo "Android platform not configured. Create Cordova project with:"
            echo "  npm install -g cordova"
            echo "  cordova platform add android"
            echo "Skipping Android build."
          fi
        env:
          BUILD_TYPE: ${{ inputs.build_type || 'debug' }}
      
      - name: Verify APK output
        run: |
          if [ -d "platforms/android/app/build/outputs/apk" ]; then
            echo "APK files found:"
            find platforms/android/app/build/outputs/apk -name "*.apk" -exec ls -lh {} \;
          else
            echo "Android platform not configured or build not completed. APK not generated."
          fi
      
      - name: Upload APK artifact
        if: success()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-${{ inputs.build_type || 'debug' }}
          path: platforms/android/app/build/outputs/apk/**/*.apk
          retention-days: 30
          if-no-files-found: ignore

  linux-build:
    name: Linux Build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libgtk-3-dev \
            libnotify-dev \
            libnss3 \
            libxss-dev \
            libxtst-dev \
            xdg-utils \
            libatspi2.0-dev \
            libdrm-dev \
            libgbm-dev \
            libasound2 \
            wget \
            unzip
      
      - name: Install dependencies
        run: |
          if [ -f package.json ]; then
            npm ci || npm install
          else
            echo "No package.json found"
          fi
      
      - name: Build Linux AppImage
        run: |
          if [ -d "electron" ] || [ -f "electron-builder.yml" ] || [ -f "electron-builder.json" ]; then
            npm run build:linux || npm run build:electron:linux || npm run build
          else
            echo "Electron not configured. Add electron project files."
            echo "Skipping Linux build."
          fi
        env:
          ELECTRON_CACHE: ${{ runner.temp }}/electron_cache
      
      - name: Verify Linux build output
        run: |
          echo "Build output:"
          ls -la dist/ 2>/dev/null || echo "Checking other locations..."
          find . -name "*.AppImage" -o -name "*.deb" -o -name "*.rpm" 2>/dev/null | head -20
      
      - name: Upload Linux artifact
        if: success()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: |
            dist/**/*.AppImage
            dist/**/*.deb
            dist/**/*.rpm
          retention-days: 30
          if-no-files-found: ignore

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: Install dependencies
        run: |
          if [ -f package.json ]; then
            npm ci || npm install
          else
            echo "No package.json found"
          fi
      
      - name: Run tests
        run: |
          if [ -f package.json ] && npm run test 2>/dev/null; then
            npm test
          else
            echo "No tests configured or package.json not found"
            echo "Add test scripts to package.json to enable testing"
          fi