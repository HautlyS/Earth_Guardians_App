version: '3.8'

services:
  # Supabase API
  postgres:
    image: supabase/postgres:15.1.0.117
    container_name: earth-guardians-postgres
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./supabase/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5

  # Supabase Studio
  studio:
    image: supabase/studio:20240101-9e91a3e
    container_name: earth-guardians-studio
    environment:
      STUDIO_PG_META_URL: http://meta:8080
      SUPABASE_URL: http://kong:8000
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-your-anon-key}
    ports:
      - "3000:3000"
    depends_on:
      - kong

  # API Gateway (Kong)
  kong:
    image: kong:2.8.1
    container_name: earth-guardians-kong
    environment:
      KONG_DATABASE: 'off'
      KONG_DECLARATIVE_CONFIG: /var/lib/kong/kong.yml
      KONG_PLUGINS: key-auth,cors
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
      KONG_ADMIN_GUI_URL: http://localhost:8002
    ports:
      - "8000:8000"
      - "8001:8001"
    volumes:
      - ./supabase/docker/kong.yml:/var/lib/kong/kong.yml
    healthcheck:
      test: ['CMD', 'kong', 'health']
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      - meta

  # PostgREST (REST API)
  postgrest:
    image: postgrest/postgrest:v11.2.0
    container_name: earth-guardians-postgrest
    environment:
      PGRST_DB_URI: postgres://postgres:postgres@postgres:5432/postgres
      PGRST_DB_SCHEMA: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${SUPABASE_JWT_SECRET:-super-secret-jwt-token-with-at-least-32-characters-long}
    ports:
      - "3001:3001"
    depends_on:
      - postgres
    healthcheck:
      test: ['CMD-SHELL', 'wget --no-visit --spider http://localhost:3001/']
      interval: 10s
      timeout: 5s
      retries: 5

  # GoTrue (Auth)
  gotrue:
    image: supabase/gotrue:v2.99.0
    container_name: earth-guardians-gotrue
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: http://localhost:9999
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://postgres:postgres@postgres:5432/postgres?search_path=auth
      GOTRUE_SITE_URL: http://localhost:3000
      GOTRUE_URI_ALLOW_LIST: '*'
      GOTRUE_DISABLE_SIGNUP: 'false'
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: 3600
      GOTRUE_JWT_SECRET: ${SUPABASE_JWT_SECRET:-super-secret-jwt-token-with-at-least-32-characters-long}
      GOTRUE_EXTERNAL_EMAIL_ENABLED: 'true'
      GOTRUE_MAILER_AUTOCONFIRM: 'true'
      GOTRUE_SMTP_ADMIN_EMAIL: admin@earthguardians.org
      GOTRUE_SMTP_HOST: ${SMTP_HOST:-mail}
      GOTRUE_SMTP_PORT: ${SMTP_PORT:-1025}
      GOTRUE_SMTP_SENDER: Earth Guardians <noreply@earthguardians.org>
      GOTRUE_SMTP_SKYP: ${SMTP_SKYP:-''}
    ports:
      - "9999:9999"
    depends_on:
      - postgres
    healthcheck:
      test: ['CMD-SHELL', 'wget --no-visit --spider http://localhost:9999/health']
      interval: 10s
      timeout: 5s
      retries: 5

  # Storage API
  storage:
    image: supabase/storage-api:v0.40.4
    container_name: earth-guardians-storage
    environment:
      ANON_KEY: ${SUPABASE_ANON_KEY:-your-anon-key}
      SERVICE_KEY: ${SUPABASE_SERVICE_KEY:-your-service-key}
      POSTGREST_URL: http://postgrest:3001
      PGRST_JWT_SECRET: ${SUPABASE_JWT_SECRET:-super-secret-jwt-token-with-at-least-32-characters-long}
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/postgres
      FILE_SIZE_LIMIT: 52428800
      STORAGE_BACKEND: file
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      TENANT_ID: stub
      REGION: stub
      GLOBAL_S3_BUCKET: stub
    ports:
      - "5000:5000"
    volumes:
      - storage_data:/var/lib/storage
    depends_on:
      - postgres
      - postgrest

  # Realtime (WebSocket)
  realtime:
    image: supabase/realtime:v2.25.50
    container_name: earth-guardians-realtime
    environment:
      PORT: 4000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: postgres
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_AFTER_CONNECT: 'SET search_path TO _realtime'
      DB_ENC_KEY: ${REALTIME_JWT_SECRET:-super-secret-jwt-token-with-at-least-32-characters-long}
      API_JWT_SECRET: ${SUPABASE_JWT_SECRET:-super-secret-jwt-token-with-at-least-32-characters-long}
      FLY_ALLOC_ID: fly123
      FLY_APP_NAME: realtime
      SECRET_KEY_BASE: UpNVntn3cDx6pq Ny5aW3v6k9KK3fR3QP5CRHP7Xk3W8G3H5K7R9S4T2V6U8X
      ERL_AFLAGS: -proto_dist inet_tcp
      DNS_NODES: "''"
    ports:
      - "4000:4000"
    depends_on:
      - postgres
    healthcheck:
      test: ['CMD-SHELL', 'wget --no-visit --spider http://localhost:4000/api/health']
      interval: 10s
      timeout: 5s
      retries: 5

  # Meta (Database Management)
  meta:
    image: supabase/postgres-meta:v0.66.2
    container_name: earth-guardians-meta
    environment:
      PG_META_PORT: 8080
      PG_META_DB_HOST: postgres
      PG_META_DB_PORT: 5432
      PG_META_DB_NAME: postgres
      PG_META_DB_USER: postgres
      PG_META_DB_PASSWORD: postgres
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    healthcheck:
      test: ['CMD-SHELL', 'wget --no-visit --spider http://localhost:8080/health']
      interval: 10s
      timeout: 5s
      retries: 5

  # Analytics (InfluxDB)
  analytics:
    image: quay.io/influxdb/influxdb:v2.7.1
    container_name: earth-guardians-analytics
    environment:
      INFLUXDB_ADMIN_TOKEN: ${INFLUXDB_TOKEN:-earth-guardians-token}
      INFLUXDB_ORG: earth-guardians
      INFLUXDB_BUCKET: analytics
    ports:
      - "8086:8086"
    volumes:
      - influxdb_data:/var/lib/influxdb
    healthcheck:
      test: ['CMD', 'influx', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # SMTP Server (for development)
  mail:
    image: maildev/maildev:v1.1.0
    container_name: earth-guardians-mail
    ports:
      - "1080:1080"
      - "1025:1025"
    environment:
      MAILDEV_SMTP_PORT: 1025
      MAILDEV_WEB_PORT: 1080
      MAILDEV_INCOMING_USER: ''
      MAILDEV_INCOMING_PASS: ''

volumes:
  postgres_data:
    driver: local
  storage_data:
    driver: local
  influxdb_data:
    driver: local

networks:
  default:
    name: earth-guardians-network